# ALL selects two mutually exclusive pydocstyle pairs, and COM812 conflicts with Ruff's formatter.
# Ruff already discards D203/D213; formatting owns COM812's trailing-comma behavior.
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D203", "D213", "COM812", "CPY001"]
[lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "PLR2004", "INP001", "PLC2701", "SLF001"]
"**/test_*.py" = ["S101", "PLR2004", "INP001", "PLC2701", "SLF001"]
"**/*_test.py" = ["S101", "PLR2004", "INP001", "PLC2701", "SLF001"]
"**/conftest.py" = ["S101", "PLR2004", "INP001", "PLC2701", "SLF001"]
[lint.flake8-quotes]
inline-quotes = "double"
[lint.flake8-copyright]
notice-rgx = "(?i)Copyright\\s+(\\(c\\)|\u00a9)"
[format]
docstring-code-format = true

# Materialized from lintmax-py 0.0.7 (hahuyhoang411/lintmax-py@917dea9) so CI, hooks,
# and documented local review enforce the same policy without an unpinned global tool.
preview = true
line-length = 123
exclude = [
  "**/.git",
  "**/.mypy_cache",
  "**/.pytest_cache",
  "**/.ruff_cache",
  "**/.tox",
  "**/.venv",
  "**/__pycache__",
  "**/build",
  "**/dist",
  "**/node_modules",
  "**/site-packages",
  "**/venv",
  "**/uv.lock",
]

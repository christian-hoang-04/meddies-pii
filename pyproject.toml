[tool.pytest.ini_options]
# Default gates cover all repository tests.
testpaths = ["tests"]
norecursedirs = [
  ".*",
  "build",
  "dist",
  "CVS",
  "_darcs",
  "{arch}",
  "*.egg",
  "venv",
  ".venv",
  ".hypothesis",
]

[tool.coverage.report]
# training/ is a namespace package, so coverage must inventory its unexecuted files.
include_namespace_packages = true

[tool.ruff]
# Align the repository's own Ruff config with the adopted lintmax gate so per-edit tooling and the
# gate format identically. Without this Ruff falls back to its default 88 while the gate formats at
# 123, and every editor-side or hook-side `ruff format` rewraps files the gate then reports as
# unformatted.
line-length = 123
# Align repo ruff with the gate: preview formatting and rule-name suppressions are the gate's
# dialect. The gate materializes `preview = true`, so without this the stable-style formatter here
# un-hugs the braces the gate hugs (132 files disagreed), and RUF102 reads every
# `# ruff: ignore[<rule-name>]` directive as an invalid rule code -- which is what let a hook-side
# fix delete them.
preview = true

[tool.ruff.lint]
# Keep lint policy explicit so Ruff releases cannot silently change repository scope.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
exclude = [".venv"]

[tool.uv]
# Security floors for vulnerable transitive dependencies. They preserve the
# existing direct dependency interfaces while keeping future lock refreshes
# above the audited fixed versions.
constraint-dependencies = [
  "aiohttp>=3.14.1,<4",
  "cbor2>=5.9.0,<6",
  "click>=8.3.3,<9",
  "filelock>=3.20.3,<4",
  "idna>=3.15,<4",
  "pyarrow>=23.0.1,<24",
  "pyasn1>=0.6.4,<0.7",
  "pygments>=2.20.0,<3",
  "requests>=2.33.0,<3",
  "setuptools>=83.0.0,<84",
  "urllib3>=2.7.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/coverage.json", "/coverage.xml"]

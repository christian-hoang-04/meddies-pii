[project]
name = "meddies-pii"
version = "0.1.0"
description = "Clinical PII data tooling for offline validation, synthetic generation, and BIOES evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=2.13.0,<3",
  "httpx>=0.28",
  "pandas>=2.3.3",
  "python-dotenv>=1.2.2",
  "huggingface_hub>=0.23.2",
  "datasets>=4.5.0",
  "modal>=1.5.3",
  "packaging>=25.0",
  "tenacity>=9.1.4",
  "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
pdf-redaction = [
  "numpy>=2.0,<3",
  "openvino==2026.1.0",
  "pillow==12.3.0",
  "pypdf==6.15.0",
  "pypdfium2==5.12.1",
  "rapidocr==3.9.2",
  "reportlab==5.0.0",
  "transformers==5.14.1",
]
training = [
  "onnx==1.22.0",
  "onnxruntime==1.28.0",
  "peft>=0.19.1",
  "torch>=2.13.0,<2.14",
  "transformers==5.14.1",
]

[project.scripts]
meddies-pii = "meddies_pii.cli:main"

[dependency-groups]
dev = [
  "basedpyright>=1.39.9",
  "faker>=40.36.0",
  "hypothesis>=6.150.3",
  "meddies-pii[pdf-redaction,training]",
  "mypy>=2.3.0",
  "onnx-ir==0.2.1",
  "pandas-stubs>=3.0.3.260530",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.0.0",
  "pymupdf==1.28.0",
  "respx>=0.22",
  "ruff>=0.16.0",
]
security = [
  "bandit==1.9.4",
]

[tool.deptry.per_rule_ignores]
# These four are reached through `importlib.import_module` or, for openvino, as the runtime
# backend rapidocr loads by name, so no static scan can see the use. The declarations are real;
# only the evidence of use is invisible.
DEP002 = ["openvino", "pypdfium2", "rapidocr", "reportlab"]
# `build_mixed_50_20_30` is the sibling migration script beside its importer, first-party by
# construction. It cannot ride `known_first_party`: the gate passes `--known-first-party` on the
# command line, and that replaces this file's list rather than extending it.
#
# The rest are container-side imports that never run in this project's own environment.
#
# Six are already declared and version-pinned in the `pip_install` package list of the very module
# that imports them: `unsloth==2026.7.4` and `pyarrow==23.0.0` in the training image lists, and
# `safetensors==0.8.0`, `onnx==1.22.0`, `onnxruntime==1.28.0` and `cryptography==49.0.0` in the ops
# script images. The declaration is real; deptry reads the manifest, not a Modal image spec.
#
# `pynvml` is the exception and is pinned nowhere. It reads GPU telemetry from the NVIDIA driver
# stack present in a CUDA container, and every use sits inside `try: ... except Exception: return`,
# so its absence degrades to no telemetry rather than a failure. Pinning it would claim a
# dependency the code is written not to need.
#
# Declaring any of them as project dependencies would be false — the installed package needs none
# of them to run locally — and `unsloth` publishes no macOS wheel, so it would break `uv sync` here.
DEP001 = [
  "build_mixed_50_20_30",
  "cryptography",
  "onnx",
  "onnxruntime",
  "pyarrow",
  "pynvml",
  "safetensors",
  "unsloth",
]
# `pymupdf` is AGPL and stays out of the permissive `pdf-redaction` extra, which
# `test_pdf_redaction_extra_is_runtime_complete_and_permissive` pins. `risk.py` imports it for the
# rendered-state signal pypdf cannot give, so the import is real and the dev-group home is the
# licensing decision, not a misplacement.
DEP004 = ["pymupdf"]

[tool.deptry.package_module_name_map]
google-genai = ["google"]
pillow = ["PIL"]
python-dotenv = ["dotenv"]

[tool.typos.default.extend-words]
# Project vocabulary: language codes, foreign-language surfaces the multilingual corpus
# carries, Vietnamese names, product names, and the deliberately misspelled label aliases
# the generator has to accept. Each is spelled the way the domain spells it.
addres = "addres" # deliberate misspelled label alias the generator must accept
adresse = "adresse" # German/Danish 'address' in a multilingual PII prompt example
alikes = "alikes" # 'look-alikes' hyphen split by the tokenizer
arange = "arange" # numpy.arange
ba = "ba" # Vietnamese digit word 'ba' (three) in a spoken-number test surface
cpy = "cpy" # Ruff's CPY rule-family prefix in the tracked strict configuration
dezember = "dezember" # German month name in a date-surface pattern
ehr = "ehr" # electronic health record
espace = "espace" # French 'espace' in a multilingual surface
februar = "februar" # German month name in a date-surface pattern
fo = "fo" # fixture token
fonction = "fonction" # French 'fonction' in a multilingual surface
fre = "fre" # ISO 639-2 code for French
groupe = "groupe" # French 'group' in an organization-name cue
hospitales = "hospitales" # Spanish 'hospitales' in a multilingual surface
instituto = "instituto" # Spanish/Portuguese 'institute' in organization-name cues
ist = "ist" # German 'is' in language-identification and clinical-prose fixtures
iy = "iy" # fixture token
januar = "januar" # German month name in a date-surface pattern
juli = "juli" # German/Dutch month name in a date-surface pattern
juni = "juni" # German/Dutch month name in a date-surface pattern
ket = "ket" # unaccented Vietnamese 'ket' (link) in an adversarial URL fixture
mis = "mis" # 'mis-extracted' hyphen split by the tokenizer
nam = "nam" # Vietnamese given name, and a deliberate misspelled label alias
nd = "nd" # ISO 639 code for Ndebele
numbe = "numbe" # deliberate misspelled label alias the generator must accept
oktober = "oktober" # German/Dutch month name in a date-surface pattern
opf = "opf" # OPF, the baseline model this repository evaluates against
ot = "ot" # fixture token
pn = "pn" # fixture token
pont = "pont" # French 'bridge' in the proper name Pont-Neuf
profesional = "profesional" # Spanish 'profesional' in a multilingual surface
sur = "sur" # French 'on' in a clinical organization negative cue
tha = "tha" # ISO 639-2 code for Thai
tham = "tham" # Vietnamese 'tham chieu' (reference) in a lab-range negative fixture
thay = "thay" # Vietnamese 'thay the' (replace) in the translation prompt
unparseable = "unparseable" # standard spelling in this codebase's error vocabulary
vor = "vor" # German 'present' in a clinical organization fixture
# The dead-code scan cannot see four kinds of live name, so the project declares them.
# Most are class-level annotated fields — dataclass, TypedDict, and Protocol members — which are
# part of a declared type's shape and are reached by construction and serialization, never by a
# name lookup the scan can follow. The rest are attributes set on test doubles so the code under
# test sees the shape the real object has, Protocol classes that exist to be structurally
# satisfied rather than referenced, and functions invoked through framework registration
# decorators. Every entry and decorator was checked against its declaration site.
[tool.vulture]
ignore_names = [
  "AI4PRIVACY_NAME_LABELS",
  "APIError",
  "AbstractContextManager",
  "Base230UnslothProbe",
  "CostLedger",
